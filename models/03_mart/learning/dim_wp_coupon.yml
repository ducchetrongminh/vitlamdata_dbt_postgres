models:
  - name: dim_wp_coupon
    description: >
      Tutor LMS coupons, one row per coupon, plus the unknown coupon (-1) for order lines
      without one. No coupon code: a usable code is a secret. Type 1. Times are Vietnam time.
    columns:
      - name: wp_coupon_key
        data_type: text
        constraints:
          - type: primary_key
      - name: wp_coupon_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
      - name: wp_coupon_title
        data_type: text
      - name: wp_coupon_status
        data_type: text
      - name: wp_coupon_type
        data_type: text
        description: "'Code' when the buyer enters it, 'Automatic' when applied at checkout."
      - name: wp_coupon_discount_type
        data_type: text
      - name: wp_coupon_discount_value
        data_type: numeric
        description: VND for a flat discount, percent for a percentage discount.
      - name: wp_coupon_applies_to
        data_type: text
      - name: starts_at
        data_type: timestamp
      - name: expires_at
        data_type: timestamp
