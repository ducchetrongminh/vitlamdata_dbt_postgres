models:
  - name: dim_wp_course
    description: >
      Tutor LMS courses and course bundles, one row per wp_course, plus the unknown
      course (wp_course_id -1). Type 1. Prices are VND. Times are Vietnam time.
    columns:
      - name: wp_course_key
        data_type: text
        constraints:
          - type: primary_key
      - name: wp_course_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
      - name: wp_course_title
        data_type: text
      - name: wp_course_summary
        data_type: text
      - name: wp_course_type
        data_type: text
        description: "'Course' or 'Course Bundle'."
      - name: wp_course_status
        data_type: text
      - name: wp_course_slug
        data_type: text
      - name: wp_course_price_type
        data_type: text
      - name: wp_course_level
        data_type: text
        description: "'Unknown' for bundles, which have no level."
      - name: wp_course_public_indicator
        data_type: text
      - name: regular_unit_price
        data_type: numeric
      - name: sale_unit_price
        data_type: numeric
        description: Null when not on sale.
      - name: published_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp
      - name: wp_instructor_key
        data_type: text
        description: Key of the course author in dim_wp_instructor.
        data_tests:
          - relationships:   # author missing from public_instructor_ids in stg_wordpress__wp_instructor
              arguments:
                to: ref('dim_wp_instructor')
                field: wp_instructor_key
              config:
                severity: warn
                where: "wp_course_status = 'Published'"
      - name: wp_instructor_id
        data_type: bigint
        description: wp_users.ID of the course author. -1 when none.

  - name: dim_wp_instructor
    description: >
      Course authors whose names are public on the course pages
      (stg_wordpress__wp_instructor), one row per instructor, plus the unknown instructor (-1).
      Type 1.
    columns:
      - name: wp_instructor_key
        data_type: text
        constraints:
          - type: primary_key
      - name: wp_instructor_id
        data_type: bigint
        description: wp_users.ID of the instructor.
        constraints:
          - type: not_null
          - type: unique
      - name: wp_instructor_name
        data_type: text
        description: The instructor's display name as published on the course pages.

  - name: dim_wp_user
    description: >
      WordPress accounts (learners, instructors, admins), one row per wp_user, plus users
      that facts reference but wp_users lacks (wp_user_status 'Deleted' or 'Not Loaded
      Yet'), plus the unknown user (-1). No names or emails, hashed or not. Type 1. Times are Vietnam time.
    columns:
      - name: wp_user_key
        data_type: text
        constraints:
          - type: primary_key
      - name: wp_user_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
      - name: wp_user_status
        data_type: text
        description: >
          'Active' for accounts in wp_users. For an account a fact references but
          wp_users lacks: 'Deleted' when its id is below the highest wp_users id (it
          existed), 'Not Loaded Yet' when above (created after the load; replaced by
          the real row next run). 'Unknown' for the unknown user.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Deleted', 'Not Loaded Yet', 'Unknown']
      - name: registered_at
        data_type: timestamp
        description: When the account was created. Null for inferred users and the unknown user.

  - name: fact_enrollment
    description: >
      Tutor LMS enrollments, one row per student per course or course bundle. Factless:
      count rows to count enrollments. Incremental on updated_at. Times are Vietnam time.
    columns:
      - name: wp_enrollment_key
        data_type: text
        constraints:
          - type: primary_key
      - name: wp_enrollment_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
      - name: student_wp_user_id
        data_type: bigint
      - name: wp_course_id
        data_type: bigint
      - name: wp_enrollment_status
        data_type: text
        description: >
          'Enrolled' when the enrollment went through (Tutor's 'completed'), not
          that the student finished the course.
      - name: student_wp_user_key
        data_type: text
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wp_user')
                field: wp_user_key
      - name: wp_course_key
        data_type: text
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wp_course')
                field: wp_course_key
      - name: enrolled_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp

  - name: fact_order_line
    description: >
      Tutor LMS order lines, one row per course or bundle bought in an order, with the
      order's buyer, status and payment rolled down. Every order status is kept; filter
      on wp_order_status / payment_status for revenue. Amounts are VND. Times are
      Vietnam time.
    columns:
      - name: wp_order_line_key
        data_type: text
        constraints:
          - type: primary_key
      - name: wp_order_no
        data_type: bigint
        description: wp_tutor_orders.id; no order dimension, so a degenerate dimension.
        constraints:
          - type: not_null
      - name: wp_order_line_no
        data_type: bigint
        description: wp_tutor_order_items.id.
        constraints:
          - type: not_null
          - type: unique
      - name: ordered_by_wp_user_id
        data_type: bigint
      - name: wp_course_id
        data_type: bigint
      - name: wp_coupon_code
        data_type: text
        description: "'UNKNOWN' when no coupon."
      - name: payment_transaction_no
        data_type: text
      - name: wp_order_type
        data_type: text
      - name: wp_order_status
        data_type: text
      - name: payment_status
        data_type: text
      - name: payment_method
        data_type: text
      - name: ordered_by_wp_user_key
        data_type: text
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wp_user')
                field: wp_user_key
      - name: wp_course_key
        data_type: text
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wp_course')
                field: wp_course_key
      - name: ordered_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp
      - name: regular_unit_price
        data_type: numeric
      - name: sale_unit_price
        data_type: numeric
      - name: discounted_unit_price
        data_type: numeric
      - name: gross_amt
        data_type: numeric
      - name: discount_amt
        data_type: numeric
      - name: net_amt
        data_type: numeric
        description: What the buyer pays for the line; sums to the order's total.
