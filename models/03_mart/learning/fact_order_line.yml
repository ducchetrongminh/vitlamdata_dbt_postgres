models:
  - name: fact_order_line
    description: >
      Tutor LMS order lines, one row per course or bundle bought in an order, with the
      order's buyer, status and payment rolled down. Every order status is kept; filter
      on wp_order_status / payment_status for revenue. Amounts are VND. Times are
      Vietnam time.
    columns:
      - name: wp_order_line_no
        data_type: bigint
        description: wp_tutor_order_items.id.
        constraints:
          - type: primary_key
      - name: wp_order_no
        data_type: bigint
        description: wp_tutor_orders.id; no order dimension, so a degenerate dimension.
        constraints:
          - type: not_null
      - name: ordered_by_wp_user_id
        data_type: bigint
      - name: wp_course_id
        data_type: bigint
      - name: wp_coupon_id
        data_type: bigint
        description: wp_tutor_coupons.id of the coupon used. -1 when none.
      - name: payment_transaction_no
        data_type: text
      - name: wp_order_type
        data_type: text
      - name: wp_order_status
        data_type: text
      - name: payment_status
        data_type: text
      - name: payment_method
        data_type: text
      - name: ordered_by_wp_user_key
        data_type: text
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wp_user')
                field: wp_user_key
      - name: wp_course_key
        data_type: text
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wp_course')
                field: wp_course_key
      - name: wp_coupon_key
        data_type: text
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wp_coupon')
                field: wp_coupon_key
      - name: ordered_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp
      - name: regular_unit_price
        data_type: numeric
      - name: sale_unit_price
        data_type: numeric
      - name: discounted_unit_price
        data_type: numeric
      - name: gross_amt
        data_type: numeric
      - name: discount_amt
        data_type: numeric
      - name: net_amt
        data_type: numeric
        description: What the buyer pays for the line; sums to the order's total.
