# Credentials for every el/ source. No secrets here: ${VAR} is replaced with the
# env var VAR when a pipeline starts (el/setup.py), like env_var() in dbt's
# profiles.yml. Locally they come from .env; in CI from the job's secrets.

# The warehouse through the tunnel (-L 5433): your login locally, loader nightly.
[destination.postgres.credentials]
host = "${PGHOST}"
port = "${PGPORT}"
database = "${PGDATABASE}"
username = "${PGUSER}"
password = "${PGPASSWORD}"

# WordPress MariaDB through the tunnel (-L 3306), read-only.
[sources.wordpress_vitlamdata.credentials]
drivername = "mysql+pymysql"
host = "127.0.0.1"
port = 3306
database = "wordpress"
username = "dlt_reader"
password = "${MARIADB_PASSWORD}"
