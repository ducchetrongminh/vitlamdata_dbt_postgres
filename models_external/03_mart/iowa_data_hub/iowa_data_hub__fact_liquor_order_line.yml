models:
  - name: iowa_data_hub__fact_liquor_order_line
    description: >
      Iowa liquor orders, one row per invoice line: one item on one store's order from the
      state, 2012-2026. Returns are lines too, with negative bottles and dollars (design:
      docs/design-external/iowa_data_hub/liquor_order.md). The export's whole-row repeats are
      dropped (README Q9), and item 3984's overpriced 2013 lines are left out (Q20).
      Amounts are USD. Why we don't follow docs/dw-naming-conventions.md#47-standard-fact-prefixes-and-suffixes
      (_amt is in VND): this dataset has USD only.
      Loads one year per run (see the model). No relationships tests on the dimension keys:
      each one scans every line, ~38M, too heavy for the database VM; the primary key
      constraint guards the grain.
    config:
      alias: fact_liquor_order_line
    columns:
      - name: order_line_no
        data_type: text
        description: >
          invoice_id up to 2025-08-29, which ends in the line number; after, an md5 of the
          whole raw row (README Q8). The primary key, as fact_order_line: a surrogate key
          over it would add a second unique column to every line.
        constraints:
          - type: primary_key
      - name: invoice_no
        data_type: text
        description: >
          The invoice, a degenerate dimension (README Q8). Unique only with store_code and
          order_date: invoice numbers were reused.
      - name: store_code
        data_type: text
      - name: product_code
        data_type: text
      - name: vendor_code
        data_type: text
        description: As on the line, the item's vendor at the time of the order.
      - name: invoice_type
        data_type: text
        description: Order, or Return (RINV-, negative quantities; liquor_sales_2026 #7).
      - name: store_key
        data_type: text
      - name: product_key
        data_type: text
      - name: vendor_key
        data_type: text
      - name: order_date
        data_type: date
        description: The day the state billed the order, in Iowa.
      - name: bottle_qty
        data_type: integer
        description: Bottles ordered; a unit of a bulk item counts as one (liquor_sales_2016 #5).
      - name: liter_qty
        data_type: numeric
        description: >
          bottle_qty × the product's latest bottle_volume_ml / 1000 (README Q15), not the
          line's sales_liters. NULL when the product has no volume.
      - name: state_bottle_cost_unit_price
        data_type: numeric
        description: What a bottle costs the state, as billed. NULL before 2025-07-01 (liquor_sales_2025 #3).
      - name: state_bottle_retail_unit_price
        data_type: numeric
        description: The state's list price for a bottle. NULL before 2025-07-01.
      - name: order_amt
        data_type: numeric
        description: >
          What the store pays the state. Not always bottles × retail: some lines keep the
          previous month's price (README Q11). Whole dollars Nov 2025 - Jan 2026 (Q10).
      - name: state_cost_amt
        data_type: numeric
        description: bottle_qty × state_bottle_cost_unit_price. NULL before 2025-07-01.
