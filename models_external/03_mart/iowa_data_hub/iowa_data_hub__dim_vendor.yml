models:
  - name: iowa_data_hub__dim_vendor
    description: >
      Companies whose liquor the state sells to stores, one row per vendor code seen on a
      sales line, 2012-2026, plus the unknown vendor ('UNKNOWN'). A vendor under 100 has two
      rows: its code before 2016-08-29 (10) and after (010) (liquor_sales_2016 #1). Type 3:
      each row keeps its own code's latest name and carries the vendor's current name
      (docs/dimensional-modeling-standards.md#31-slowly-changing-dimensions-scd; design:
      docs/design-external/iowa_data_hub/liquor_order.md).
    config:
      alias: dim_vendor
    columns:
      - name: vendor_key
        data_type: text
        constraints:
          - type: primary_key
      - name: vendor_code
        data_type: text
        description: vendor_number as on the line, kept as text. 2 digits for a vendor under 100 before 2016-08-29 (10), 3 after (010).
        constraints:
          - type: not_null
          - type: unique
      - name: historic_vendor_name
        data_type: text
        description: >
          The latest name on this code's lines. For a code of the old system (10), the name it
          had then.
      - name: current_vendor_name
        data_type: text
        description: >
          The vendor's name today: for a 2-digit code, the name of its 3-digit code (10 takes
          010's); otherwise historic_vendor_name. A number can pass to another company under a
          new name (e.g. 469 TY KU LLC, then DAVOS BRANDS LLC); only the latest is kept.
