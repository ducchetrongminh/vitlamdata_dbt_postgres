models:
  - name: iowa_data_hub__int_order_line__deduplicated
    description: >
      Sales lines of every year, one row per invoice line: staging with the export's
      whole-row repeats dropped (README Q9).
    config:
      alias: int_order_line__deduplicated
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null

  - name: iowa_data_hub__int_product__category_picked
    description: >
      The catalog at one row per product: each item keeps one category, a real one over the
      tag categories (liquor_products #1, README Q2). Plus the unknown product ('UNKNOWN').
    config:
      alias: int_product__category_picked
    columns:
      - name: product_code
        data_tests:
          - unique
          - not_null

  - name: iowa_data_hub__int_store__latest_picked
    description: >
      One row per store that ordered, from the sales lines: its latest line's name and
      location (README Q14, liquor_sales_2026 #5). Plus the unknown store ('UNKNOWN').
      Incremental, one year per run: a first build reads the first year, each run the
      next, until the last year, which every run then rereads.
    config:
      alias: int_store__latest_picked
    columns:
      - name: store_code
        data_tests:
          - unique
          - not_null
      - name: last_order_year
        description: >
          The latest year the store ordered in. Its max is the latest year read: the next
          run reads the year after it. Null on the unknown store.

  - name: iowa_data_hub__int_vendor__latest_picked
    description: >
      One row per vendor code seen on a sales line, 10 and 010 apart (liquor_sales_2016 #1):
      its latest line's name (liquor_sales_2025 #6).
      Plus the unknown vendor ('UNKNOWN'). Incremental, one year per run, as
      iowa_data_hub__int_store__latest_picked.
    config:
      alias: int_vendor__latest_picked
    columns:
      - name: vendor_code
        data_tests:
          - unique
          - not_null
      - name: last_order_year
        description: >
          The latest year the vendor sold in. Its max is the latest year read: the next run
          reads the year after it. Null on the unknown vendor.

  - name: iowa_data_hub__int_vendor__current_named
    description: >
      iowa_data_hub__int_vendor__latest_picked with today's name as vendor_name: a code of
      the old system (10) takes the name of its later code (010) (liquor_sales_2016 #1). Each
      code's own name moves to historic_vendor_name. Plus the unknown vendor.
    config:
      alias: int_vendor__current_named
    columns:
      - name: vendor_code
        data_tests:
          - unique
          - not_null
