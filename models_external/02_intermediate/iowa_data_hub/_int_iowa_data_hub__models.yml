models:
  - name: iowa_data_hub__int_order_line__deduplicated
    description: >
      Sales lines of every year, one row per invoice line: staging with the export's
      whole-row repeats dropped (README Q9). No tests: the model is ephemeral, so each test
      reruns the dedupe, a sort of every year's ~38M lines, which ran the database VM out of
      temp disk.
    config:
      alias: int_order_line__deduplicated

  - name: iowa_data_hub__int_order_line__joined_to_product
    description: >
      One row per invoice line, with liter_qty from the product's latest bottle volume
      (README Q15). No tests, for the reason on iowa_data_hub__int_order_line__deduplicated.
    config:
      alias: int_order_line__joined_to_product

  - name: iowa_data_hub__int_product__category_picked
    description: >
      One row per product in the catalog or on a sales line (README Q1), catalog values
      first. One category per item: its latest line's code, mapped by
      iowa_data_hub__legacy_category_map; else its catalog category (Q2, Q16, Q17, Q19,
      Q21). Plus the unknown product ('UNKNOWN').
    config:
      alias: int_product__category_picked
    columns:
      - name: product_code
        data_tests:
          - unique
          - not_null
      - name: category_code
        description: The resolved current code. 'Unknown' when neither the lines nor the catalog name give one.
      - name: category_name
        description: The latest name of category_code on the lines, else the catalog name in upper case.
      - name: historic_category_name
        description: >
          The category name on the item's latest line (type 3, README Q21), e.g. an old
          taxonomy name. For an item never sold, category_name.

  - name: iowa_data_hub__int_store__latest_picked
    description: >
      One row per store that ordered, from the sales lines: its latest line's name and
      location (README Q14, liquor_sales_2026 #5). Plus the unknown store ('UNKNOWN').
      Incremental, one year per run: a first build reads the first year, each run the
      next, until the last year, which every run then rereads.
    config:
      alias: int_store__latest_picked
    columns:
      - name: store_code
        data_tests:
          - unique
          - not_null
      - name: last_order_year
        description: >
          The latest year the store ordered in. Its max is the latest year read: the next
          run reads the year after it. Null on the unknown store.

  - name: iowa_data_hub__int_vendor__latest_picked
    description: >
      One row per vendor code seen on a sales line, 10 and 010 apart (liquor_sales_2016 #1):
      its latest line's name (liquor_sales_2025 #6).
      Plus the unknown vendor ('UNKNOWN'). Incremental, one year per run, as
      iowa_data_hub__int_store__latest_picked.
    config:
      alias: int_vendor__latest_picked
    columns:
      - name: vendor_code
        data_tests:
          - unique
          - not_null
      - name: last_order_year
        description: >
          The latest year the vendor sold in. Its max is the latest year read: the next run
          reads the year after it. Null on the unknown vendor.

  - name: iowa_data_hub__int_vendor__current_named
    description: >
      iowa_data_hub__int_vendor__latest_picked with today's name as vendor_name: a code of
      the old system (10) takes the name of its later code (010) (liquor_sales_2016 #1). Each
      code's own name moves to historic_vendor_name. Plus the unknown vendor.
    config:
      alias: int_vendor__current_named
    columns:
      - name: vendor_code
        data_tests:
          - unique
          - not_null

  - name: iowa_data_hub__int_category__latest_named
    description: >
      One row per category code seen on a sales line, with its latest name (liquor_sales_2025
      #5, README Q21). Retired codes keep their row. Incremental, one year per run, as
      iowa_data_hub__int_store__latest_picked.
    config:
      alias: int_category__latest_named
    columns:
      - name: category_code
        data_tests:
          - unique
          - not_null
      - name: last_order_year
        description: >
          The latest year the code was used. Its max is the latest year read: the next run
          reads the year after it.

  - name: iowa_data_hub__int_product__latest_picked
    description: >
      One row per item seen on a sales line, from its latest line, preferring one whose
      category is not TEMPORARY & SPECIALTY PACKAGES (README Q1, Q2, Q15). The category code
      is as on the line: iowa_data_hub__int_product__category_picked maps and names it.
      Incremental, one year per run, as iowa_data_hub__int_store__latest_picked.
    config:
      alias: int_product__latest_picked
    columns:
      - name: product_code
        data_tests:
          - unique
          - not_null
      - name: category_code
        description: The category code on the picked line, as loaded. Null when the item's lines have none.
      - name: category_name
        description: The category name on the picked line.
      - name: category_ordered_on
        description: >
          Order date of the picked line. Chooses the category map's window: a code number
          can mean another category before 2016-08-29. Not always the item's last order:
          the category preference can pick an older line of the year.
      - name: last_order_year
        description: >
          The year of the picked line. Its max is the latest year read: the next run reads the
          year after it.
