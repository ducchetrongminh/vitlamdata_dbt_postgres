models:
  - name: stg_iowa_data_hub__liquor_product
    description: >
      The product catalog, one row per item per category, as loaded (liquor_products #1).
      Only the catalog's latest snapshot: items sold in the past but delisted are not here.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['product_code', 'category_name']
    columns:
      - name: product_code
        description: item_no, the item's number. Digits, kept as text.
        data_tests:
          - not_null
      - name: category_name
        description: >
          Catalog category name, mixed case. Includes the tag categories 'Temporary &
          Specialty Packages' and 'Iowa Spirits Manufacturers'.
        data_tests:
          - not_null
      - name: product_name
        description: im_desc, spaces squeezed. Keeps the status codes it carries (DISCO, HA, USE CODE, ...).
      - name: pack
        description: Bottles per case.
      - name: inner_pack
        description: As loaded; meaning unknown (README Q4).
      - name: proof
        description: Null where the catalog has 0.
      - name: age_years
        description: Age in years (README Q3). Null when no age is stated.
      - name: upc
        description: Not a key, shared across unrelated items (#9). 'Unknown' for the all-zero placeholder.
      - name: listed_date
        description: list_on. Can be after the snapshot date (#3).
      - name: state_bottle_cost_unit_price
        description: What the state pays per bottle, current list. USD.
      - name: state_bottle_retail_unit_price
        description: What a store pays the state per bottle, current list. USD.

  - name: stg_iowa_data_hub__liquor_order_line
    description: >
      Sales lines of every year, 2012-2026, cleaned, with the export's whole-row repeats
      kept (README Q9); iowa_data_hub__int_order_line__deduplicated drops them. Holds only
      the columns a model uses so far: the store's, the vendor's, the product's and its
      category's.
      No tests. Why we don't follow docs/dbt-layers-conventions.md#21-staging-structural-constraints
      (unique + not_null on the staging key): each test scans every year's lines, ~38M,
      which is too heavy for the database VM. The store and vendor codes are tested in the
      dims' intermediate models.
    columns:
      - name: order_line_id
        description: >
          invoice_id up to 2025-08-29, when it still ends in the line number; after, an md5 of
          the whole raw row (README Q8). Not unique here: a repeated line repeats its id,
          equal to its original in every column, until
          iowa_data_hub__int_order_line__deduplicated drops the repeats.
      - name: store_code
        description: store_no. 4 digits, or 6 starting 010; kept as text (#8).
      - name: vendor_code
        description: >
          vendor_number, as loaded: before 2016-08-29 vendors under 100 have no leading zero,
          e.g. 10, later 010 (liquor_sales_2016 #1). 'UNKNOWN' on the few lines without one
          (liquor_sales_2021 #1).
      - name: product_code
        description: item_no, the item's number. Digits, kept as text; joins liquor_products.item_no (README Q1).
      - name: ordered_on
      - name: order_year
        description: >
          The year of the source table the line comes from (liquor_sales_<year>). A
          constant in each part of the union, so filtering on it reads only that year.
      - name: store_name
        description: The store's name on this line, as loaded. Changes over time (#5).
      - name: store_zip_code
        description: >
          5 digits, as loaded. Fixed in iowa_data_hub__int_store__latest_picked: store
          2687's typo 57222 (README Q12) and store 4307's 712-2 (liquor_sales_2016 #3).
      - name: county_fips_code
        description: Iowa state code 19 + county code.
      - name: vendor_name
        description: >
          The vendor's name on this line, as loaded. Changes over time (liquor_sales_2025 #6);
          cleaned in iowa_data_hub__int_vendor__latest_picked.
      - name: product_name
        description: im_desc on this line, as loaded. Changes over time (liquor_sales_2026 #6).
      - name: pack
        description: Bottles per case on this line. Changes over time for some items (#6).
      - name: bottle_volume_ml
        description: >
          As loaded. Flips between one bottle and the whole pack for some minis (README Q15);
          0 on 2 lines of 2015 (liquor_sales_2015 #3).
      - name: category_code
        description: >
          The item's category code on this line, 7 digits, as loaded. Codes retired in 2016,
          2022 and 2024 are mapped by seed iowa_data_hub__legacy_category_map (README Q16,
          Q17, Q21). Null on a few lines (liquor_sales_2026 #4).
      - name: category_name
        description: >
          The code's name on this line, upper case, as loaded. A code's name can change
          (liquor_sales_2025 #5).
