
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'vitlamdata_dbt_postgres'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'vitlamdata_dbt_postgres'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Layers and their defaults (docs/architecture.md §5). Schemas: on prod as
# written, on dev and CI prefixed with the target schema (generate_schema_name).
models:
  vitlamdata_dbt_postgres:
    01_staging:
      +materialized: view
      +schema: staging
    02_intermediate:
      +materialized: ephemeral # a model may override to view/table; it lands in intermediate
      +schema: intermediate
    03_mart:
      +materialized: table
      +contract:
        enforced: true
      +post-hook: "{{ assert_no_pii_columns() }}"
      # One entry per domain folder, schema mart_<domain>:
      # sales:
      #   +schema: mart_sales
