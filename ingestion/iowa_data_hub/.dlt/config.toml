# dlt config for iowa_data_hub: Iowa liquor products and sales from the Iowa Data Hub
# (CC BY 4.0, Iowa Alcoholic Beverages Division), architecture §3.
# Catalog: https://data.iowa.gov/catalog/dataset/1051
#
# Any key can be overridden with an env var: sections joined by __, upper case.
# IOWA_DATA_HUB__DATASET_NAME=dbt_duc_raw_iowa_data_hub

[runtime]
log_level = "INFO"

[iowa_data_hub]
dataset_name = "raw_iowa_data_hub"

# No UNIQUE index on _dlt_id. Each row lands at a random spot in it, and on the
# cold HDD those scattered writes made a full reload take hours. Nothing reads
# raw rows by _dlt_id. Applies to tables dlt creates, not existing ones.
[iowa_data_hub.destination.postgres]
create_indexes = false

[sources.iowa_data_hub]
# Product catalog, updated monthly; each load replaces it.
liquor_products_dataset = 1029

# Sales, one dataset per year. The all-years dataset (1051) exports an empty zip,
# so load the yearly ones. Iowa publishes a new id each January: add it here. The
# last year is reloaded every run; earlier years load once (pipeline.py).
# 2026 is partial until Iowa's last monthly update for the year.
# TEMP (PR #41 test): only 2025 and 2026 load. Uncomment the rest after the test.
[sources.iowa_data_hub.liquor_sales_datasets]
# 2012 = 1249
# 2013 = 1250
# 2014 = 1251
# 2015 = 1252
# 2016 = 1253
# 2017 = 1254
# 2018 = 1255
# 2019 = 1256
# 2020 = 1257
# 2021 = 1258
# 2022 = 1259
# 2023 = 1260
# 2024 = 1261
2025 = 1262
2026 = 1263
