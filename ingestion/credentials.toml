# Credentials for every ingestion/ source. No secrets here: ${VAR} is replaced with the
# env var VAR when a pipeline starts (ingestion/setup.py), like env_var() in dbt's
# profiles.yml. Locally they come from .env; in CI from the job's secrets.

# The warehouse through the tunnel (-L 5433): your login locally, loader nightly.
[destination.postgres.credentials]
host = "${PGHOST}"
port = "${PGPORT}"
database = "${PGDATABASE}"
username = "${PGUSER}"
password = "${PGPASSWORD}"

# WordPress MariaDB through the tunnel (-L 3306), read-only.
[sources.wordpress.credentials]
drivername = "mysql+pymysql"
host = "${MARIADB_HOST}"
port = "${MARIADB_PORT}"
database = "${MARIADB_DATABASE}"
username = "${MARIADB_USER}"
password = "${MARIADB_PASSWORD}"

# iowa_liquor only: create its tables in tablespace `cold` (infra HDD disk; issue #28).
# Here, not in its .dlt/config.toml: dlt refuses any `credentials` key in config.toml.
# dlt adds its own search_path to these options; host, user etc. still come from above.
[iowa_liquor.destination.postgres.credentials.query]
options = "-c default_tablespace=cold"
