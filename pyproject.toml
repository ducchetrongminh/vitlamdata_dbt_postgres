[project]
name = "vitlamdata-dbt-postgres"
version = "0.1.0"
requires-python = ">=3.12"
# dbt v2 (GA Sept 2026) does not support Postgres yet; stay on v1 (<2) until it does.
dependencies = [
    "dbt-core>=1.9,<2",
    "dbt-postgres>=1.9,<2",
]

[dependency-groups]
dev = [
    "sqlfluff>=4.4.0",
]
# el/: extract-load with dlt. CI can install only these: uv sync --only-group el
el = [
    "dlt[postgres,sql-database]>=1.31.0",
    "pymysql>=1.2.3",
]

[tool.uv]
default-groups = ["dev", "el"]

