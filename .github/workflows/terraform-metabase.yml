name: terraform-metabase

# Metabase Terraform (terraform/metabase/). Same flow as terraform.yml, minus
# the SSH tunnel and psql: Metabase is reached over its public HTTPS API.
# - PR touching terraform/metabase/: plan, posted as a PR comment.
# - Push to main touching terraform/metabase/: apply.
# - Run workflow (workflow_dispatch) on main: the same apply.
#
# Runs in environment `admin` for the dbt-terraform service account, which
# reads the state bucket and the secret metabase-api-key.
on:
  pull_request:
    branches: [main]
    paths: ["terraform/metabase/**", ".github/workflows/terraform-metabase.yml"]
  push:
    branches: [main]
    paths: ["terraform/metabase/**", ".github/workflows/terraform-metabase.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # WIF

env:
  WIF_PROVIDER: projects/541617847124/locations/global/workloadIdentityPools/github/providers/github-actions
  SERVICE_ACCOUNT: dbt-terraform@vit-lam-data.iam.gserviceaccount.com

defaults:
  run:
    working-directory: terraform/metabase

jobs:
  plan:
    # Same-repo guard, as in terraform.yml. Never switch to pull_request_target.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: admin
    # One plan per PR at a time: a plan takes minutes and holds the state lock,
    # so overlapping runs time out waiting for it. Never cancel a running one:
    # a killed run leaves its lock behind (RUNBOOK.md, Metabase Terraform).
    concurrency:
      group: terraform-metabase-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write # the plan comment
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform fmt -check
      - run: terraform init -input=false
      - run: terraform validate
      # -parallelism=30: each metabase_collection_permission read fetches the
      # whole collection graph, so reads dominate. Lower it if Metabase slows
      # down for users during a run.
      - run: terraform plan -input=false -no-color -parallelism=30 -lock-timeout=10m -out=tfplan
      - run: terraform show -no-color tfplan > plan.txt

      - uses: actions/github-script@v7
        with:
          script: |
            const plan = require('fs').readFileSync('terraform/metabase/plan.txt', 'utf8');
            // A comment holds at most 65536 characters.
            const body = plan.length > 60000 ? plan.slice(0, 60000) + '\n… truncated, see the job log' : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Metabase Terraform plan — \`${context.sha.slice(0, 7)}\`\n<details><summary>show</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`,
            });

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: admin
    concurrency: terraform-metabase-apply
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve -parallelism=30 -lock-timeout=10m
