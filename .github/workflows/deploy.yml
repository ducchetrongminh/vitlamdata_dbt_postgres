name: deploy

# On merge to main: build in prod only the models the merge changed, and their
# children (docs/architecture.md §8). Runs dbt-build.yml with slim, so it also
# uploads the new manifest and refreshes the docs after a successful build.
#
# dbt-build.yml's job holds `concurrency: prod`, so a deploy during nightly waits.
# shortcut: GitHub keeps one pending job per concurrency group, and a newer one
# cancels the older. So a merge while prod is busy can cancel a waiting deploy,
# or a waiting nightly job. The next nightly full build catches up. Revisit if
# merges often land around 02:00 ICT.
on:
  push:
    branches: [main]
    paths:
      - "models/**"
      - "models_external/**"
      - "macros/**"
      - "tests/**"
      - "seeds/**"
      - "snapshots/**"
      - "dbt_project.yml"
      - "profiles.yml"
      - "packages.yml"

permissions:
  contents: read
  id-token: write # WIF, and the Pages deploy
  pages: write

jobs:
  build:
    uses: ./.github/workflows/dbt-build.yml
    with:
      slim: true
